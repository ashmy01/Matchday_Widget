<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MatchDay Widget">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10233a"/>
      <stop offset="1" stop-color="#0b0d17"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ddc97"/>
      <stop offset="1" stop-color="#2bb3ff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#ring)" stroke-width="20" opacity="0.9"/>
  <g transform="translate(256 256)">
    <circle r="120" fill="#f5f7ff"/>
    <!-- simple football pentagon pattern -->
    <polygon points="0,-46 44,-14 27,38 -27,38 -44,-14" fill="#11151f"/>
    <g fill="#11151f">
      <polygon points="0,-120 24,-92 -2,-70 -30,-92"/>
      <polygon points="120,-26 96,8 70,-12 84,-44"/>
      <polygon points="-120,-26 -84,-44 -70,-12 -96,8"/>
      <polygon points="74,104 40,116 34,82 64,72"/>
      <polygon points="-74,104 -64,72 -34,82 -40,116"/>
    </g>
  </g>
</svg>
